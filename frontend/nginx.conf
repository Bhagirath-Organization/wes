# Serves the built SPA and proxies /api to the backend service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown routes resolve to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI endpoints (project decomposition, executive reasoning) run local
        # CPU inference and legitimately take many minutes. The nginx default
        # read timeout of 60s aborted them with a 504 whose body is text/html,
        # which the JSON client surfaced as "expected JSON, received text/html".
        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
        proxy_buffering       off;
    }
}
